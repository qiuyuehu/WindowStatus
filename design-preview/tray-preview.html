<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>托盘菜单预览</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0a;
    font-family: 'Microsoft YaHei UI', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    gap: 60px;
  }
  .label { color: #666; font-size: 12px; text-align: center; margin-bottom: 8px; }

  /* 旧版托盘菜单 */
  .tray-old {
    background: #16213e;
    border: 1px solid #2a2a4e;
    border-radius: 8px;
    padding: 4px 0;
    min-width: 200px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.4);
  }
  .tray-old .item {
    padding: 8px 16px;
    font-size: 13px;
    color: #ddd;
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: default;
  }
  .tray-old .item:hover { background: rgba(255,255,255,0.08); }
  .tray-old .sep { height: 1px; background: #2a2a4e; margin: 4px 8px; }
  .tray-old .check { color: #4ecdc4; }
  .tray-old .arrow { color: #888; margin-left: auto; }

  /* 新版托盘菜单 */
  .tray-new {
    background: #1a1a1a;
    border: 1px solid #2a2a2a;
    border-radius: 8px;
    padding: 4px 0;
    min-width: 200px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.5);
  }
  .tray-new .item {
    padding: 8px 16px;
    font-size: 13px;
    color: #e8e8e8;
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: default;
  }
  .tray-new .item:hover { background: rgba(255,255,255,0.06); }
  .tray-new .sep { height: 1px; background: #2a2a2a; margin: 4px 8px; }
  .tray-new .check { color: #d97706; }
  .tray-new .arrow { color: #666; margin-left: auto; }
  .tray-new .highlight { color: #d97706; }
</style>
</head>
<body>

<div>
  <div class="label">旧版（#16213e 蓝底 + 青色勾选）</div>
  <div class="tray-old">
    <div class="item">显示悬浮窗</div>
    <div class="item">隐藏悬浮窗</div>
    <div class="sep"></div>
    <div class="item"><span class="check">✓</span> 取消置顶</div>
    <div class="item">透明度 <span class="arrow">▸</span></div>
    <div class="sep"></div>
    <div class="item">使用统计</div>
    <div class="item">导出统计 <span class="arrow">▸</span></div>
    <div class="item">设置</div>
    <div class="sep"></div>
    <div class="item"><span class="check">✓</span> 关闭时最小化到托盘</div>
    <div class="item"><span class="check">✓</span> 开机自启动</div>
    <div class="sep"></div>
    <div class="item">重启</div>
    <div class="item">关于</div>
    <div class="item">退出</div>
  </div>
</div>

<div>
  <div class="label">新版（#1a1a1a 灰黑底 + 琥珀勾选）</div>
  <div class="tray-new">
    <div class="item">显示悬浮窗</div>
    <div class="item">隐藏悬浮窗</div>
    <div class="sep"></div>
    <div class="item"><span class="check">✓</span> 取消置顶</div>
    <div class="item">透明度 <span class="arrow">▸</span></div>
    <div class="sep"></div>
    <div class="item">使用统计</div>
    <div class="item">导出统计 <span class="arrow">▸</span></div>
    <div class="item">设置</div>
    <div class="sep"></div>
    <div class="item"><span class="check">✓</span> 关闭时最小化到托盘</div>
    <div class="item"><span class="check">✓</span> 开机自启动</div>
    <div class="sep"></div>
    <div class="item">重启</div>
    <div class="item">关于</div>
    <div class="item">退出</div>
  </div>
</div>

</body>
</html>
